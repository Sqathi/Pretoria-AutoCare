<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Pretoria AutoCare Detailing</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Pretoria AutoCare Detailing</h1>
        <p>Professional vehicle care in Pretoria</p>
    </header>

    <!-- Main navigation menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main enquiry content -->
    <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below if you would like to enquire
                about our vehicle cleaning and detailing services.
            </p>
        </section>

        <!-- Customer enquiry form -->
        <form>

            <!-- Customer name -->
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <!-- Customer email -->
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <!-- Customer phone -->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <br><br>

            <!-- Service selection -->
            <label for="service">Requested Service:</label>
            <select id="service" name="service" required>
                <option value="">Please select a service</option>
                <option value="exterior-wash">Exterior Wash</option>
                <option value="interior-cleaning">Interior Cleaning</option>
                <option value="full-detailing">Full Vehicle Detailing</option>
                <option value="add-ons">Detailing Add-ons</option>
            </select>

            <br><br>

            <!-- Preferred date -->
            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date" required>

            <br><br>

            <!-- Customer message -->
            <label for="message">Message:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="30"
                placeholder="Tell us how we can help you."></textarea>

            <br><br>

            <!-- Submit button -->
            <button type="submit">Submit Enquiry</button>

        </form>

    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Pretoria AutoCare Detailing. All rights reserved.</p>
    </footer>

</body>

</html>
