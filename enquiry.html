<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Service Enquiry | Pretoria AutoCare</title>
    <meta name="description" content="Submit a service enquiry to Pretoria AutoCare. Tell us about your vehicle and the automotive services you need.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Pretoria AutoCare Detailing</h1>
        <p>Professional vehicle care in Pretoria</p>
    </header>

    <!-- Main navigation menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main enquiry content -->
    <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below if you would like to enquire
                about our vehicle cleaning and detailing services.
            </p>
        </section>

        <form id="enquiryForm">
 <!-- Customer name -->
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>
    <br><br>

    <!-- Customer email -->
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <!-- Customer phone -->
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>
    <br><br>

    <!-- Customer message -->
    <label for="message">Your Enquiry:</label>
    <textarea id="message" name="message" required></textarea>
    <br><br>

    <button type="submit">Submit Enquiry</button>

    <p id="formMessage" role="alert"></p>

</form>

    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Pretoria AutoCare Detailing. All rights reserved.</p>
    </footer>
<script src="js/script.js" defer></script>
</body>

</html>
